<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Gafete - Reverso</title>

    {{ESTILOS}}

</head>

<body>

<div class="gafete">

    <!-- TÍTULO -->

    <div class="titulo">

        <h2>
            SUBDIRECCIÓN DE ENSEÑANZA, CAPACITACIÓN
        </h2>

        <h2>
            INVESTIGACIÓN Y CALIDAD EN SALUD
        </h2>

    </div>


    <!-- MENSAJE -->

    <div class="mensaje">

        <p>
            PARA MAYOR INFORMACIÓN Y PARA BRINDAR
        </p>

        <p>
            ATENCIÓN MÉDICA
        </p>

        <p>
            A FAMILIARES CON DERECHO ESCANEAR QR
        </p>

    </div>


    <!-- QR -->

    <div class="qr">

        <img
            src="{{QR}}"
            alt="Código QR">

    </div>


    <!-- FIRMA -->

    <div class="firma">

        <div class="linea"></div>

        <div class="textoFirma">

            Firma del alumno

        </div>

    </div>


    <!-- BANNER -->

    <div class="pie">

        <img
            src="{{Banner}}"
            alt="Banner">

    </div>

</div>

</body>

</html>
